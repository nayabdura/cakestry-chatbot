# =============================================================================
#  Cakestry AI Assistant — Local / Production compose stack
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: cakestry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cakestry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cakestry_password}
      POSTGRES_DB: ${POSTGRES_DB:-cakestry_assistant}
    volumes:
      - cakestry_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cakestry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cakestry-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cakestry_redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cakestry-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cakestry}:${POSTGRES_PASSWORD:-cakestry_password}@db:5432/${POSTGRES_DB:-cakestry_assistant}?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  cakestry_pgdata:
  cakestry_redisdata:
